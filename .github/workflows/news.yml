name: news

# Collect live market news every 5 minutes (GitHub may run scheduled jobs a few
# minutes late when its servers are busy). The result is published as
# news.json on the "news" branch, which the site reads directly.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            state/export

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Previous news (kept for 3 days)
        run: git fetch --depth 1 origin news && git show origin/news:news.json > prev.json || echo "no previous news"

      - name: Collect
        env:
          NEWS_PREV: prev.json
          NEWS_OUT: out
        run: python pipeline/news.py

      - name: Publish to the news branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b news
          git config user.name "terminal-bot"
          git config user.email "terminal-bot@users.noreply.github.com"
          git add news.json
          git commit -q -m "news $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news
